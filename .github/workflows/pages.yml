name: Deploy public demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy read-only demo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build read-only demo
        env:
          # ★ base **必须**等于仓库名：Pages 项目站挂在 `/<repo>/` 下，而 vite 的
          # base 决定 index.html 里 `/xxx/assets/index-*.js` 的前缀。2026-10-17 仓库改名
          # （trae-workbuddy-switch → qoder-trae-workbuddy-switch）后，写死的旧 slug 让
          # 线上 demo 变成空白页（index.html 200、JS 全 404、`#root` 无子节点）。
          # 传进去而不是写死，改名即自动跟随；`scripts/check-pages-base.cjs` 是这条的护栏。
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:demo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # `build:demo` 输出到 dist-demo；`dist/` 是 WebUI/Tauri 构建，不参与 Pages。
          path: dist-demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
