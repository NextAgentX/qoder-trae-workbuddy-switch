  background: color-mix(in oklab, var(--primary) 12%, transparent);
  color: var(--primary);
}

/* 计数 / 筛选提示。生效时是一枚**带底色的常驻 pill** —— 持久化偏好最容易造成
   「我的账号怎么少了」，提示弱一点就等于没提示（不是灰字、更不是一次性 toast）。 */
.agg-count { font-size: 12px; color: var(--muted-fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.agg-count b { color: var(--foreground); font-weight: 600; }
.agg-count.filtered {
  display: inline-flex; align-items: center; gap: 2px; height: 30px; padding: 0 4px 0 10px;
  border-radius: 9px; color: var(--primary);
  background: color-mix(in oklab, var(--primary) 13%, transparent);
  border: 1px solid color-mix(in oklab, var(--primary) 30%, transparent);
}
.agg-count.filtered b { color: var(--primary); }

/* ── 作用域分组 ── */
.agg-group { margin-top: 20px; }
.agg-group:first-child { margin-top: 14px; }
.agg-group-head { display: flex; align-items: center; gap: 8px; padding: 0 2px 10px; }
.agg-gh-meta { font-size: 11.5px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
.agg-gh-meta b { color: var(--foreground); font-weight: 550; }
.agg-gh-btn { opacity: 0; transition: opacity .12s; }
.agg-group:hover .agg-gh-btn, .agg-gh-btn:focus-visible { opacity: 1; }

/* 网格：3 列为主，4 列只在超宽屏。
   WB 卡页脚有 5 个程序位胶囊 + 更多按钮，单行不换行约需 256px；指标行约需 250px。
   ⇒ ≥1600 才 4 列；1101–1599 三列（1280 笔记本就是这一档）；761–1100 两列。 */
.agg-grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 761px)  { .agg-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1101px) { .agg-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1600px) { .agg-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

/* 指标行撑开，让页脚（程序位 + 更多）落在卡片底部 —— 同行等高。
   只作用于聚合页：账号页保持原样，避免把「聚合页的修正」变成全站视觉改动。 */
.agg-grid .acct > .acct-metrics { flex: 1; align-items: flex-start; }

/* 平铺视图的「归属说明」：一行极轻的小字，**不是第二枚 badge** ——
   否则它和下面的状态 chips 会形成两行徽章，用户分不清哪个是状态。 */
.acct-scope-line { display: flex; align-items: center; gap: 5px; margin-top: -3px; font-size: 10.5px; color: var(--muted-fg); }
.acct-scope-line .scope-mark { width: 14px; height: 14px; border-radius: 4px; }
.acct-scope-line .scope-mark svg { width: 9px; height: 9px; }

/* ── 三种「空」必须彼此可辨 ──
   ① 加载失败：组内一整行虚线红卡 + 重试（不是顶部 banner：6 个失败会堆 6 条） */
.agg-fail {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 13px 15px;
  border-radius: var(--radius); font-size: 12.5px;
  border: 1px dashed color-mix(in oklab, var(--destructive) 45%, var(--border));
  background: color-mix(in oklab, var(--destructive) 6%, transparent);
}
.agg-fail .ico {
  width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0;
  background: color-mix(in oklab, var(--destructive) 16%, transparent); color: var(--destructive);
}
.agg-fail .ico svg { width: 14px; height: 14px; }
.agg-fail .t { flex: 1; min-width: 0; }
.agg-fail .t b { display: block; font-weight: 550; color: var(--foreground); }
.agg-fail .t span { display: block; font-size: 11.5px; color: var(--muted-fg); margin-top: 1px; }

/* ② 未安装 / 没有账号：一行虚线说明，不占卡片位，也不渲染组标题（说明行里已带 chip） */
.agg-note {
  display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-radius: 10px;
  border: 1px dashed var(--border-strong); color: var(--muted-fg); font-size: 12px;
}
.agg-note svg { width: 14px; height: 14px; flex-shrink: 0; }
.agg-note b { color: var(--foreground); font-weight: 550; }
/* Q3 方案 C 的新增账号提示：实线 + 警告色，与「未安装」那种灰虚线区分开 */
.agg-newcomer {
  margin-top: 12px; border-style: solid; color: var(--warning);
  border-color: color-mix(in oklab, var(--warning) 40%, var(--border));
  background: color-mix(in oklab, var(--warning) 7%, transparent);
}

/* ── 筛选面板 ──
   应用后生效（不 live）：面板盖住了列表，live 改动用户根本看不见。 */
.filter-pop {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; width: 352px;
  display: flex; flex-direction: column; max-height: min(66vh, 540px);
  border-radius: 12px; background: var(--popover); border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-lg); overflow: hidden;
}
.fp-head { padding: 11px 12px 9px; border-bottom: 1px solid var(--border); }
.fp-head b { display: block; font-size: 12.5px; font-weight: 600; }
.fp-head span { display: block; font-size: 10.5px; color: var(--muted-fg); margin-top: 3px; line-height: 1.5; }
.fp-list { flex: 1; overflow-y: auto; padding: 4px 6px 6px; }
.fp-sep { height: 1px; margin: 5px 7px; background: var(--border); }
.fp-row {
  display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px;
  border-radius: 8px; text-align: left; transition: background .12s;
}
.fp-row:hover { background: var(--accent); }
.fp-row .t { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.fp-row .t b { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fp-row .t span { font-size: 10.5px; color: var(--muted-fg); }
.fp-row .n { font-size: 10.5px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
.fp-row .scope-mark { width: 22px; height: 22px; border-radius: 7px; }
.fp-row .scope-mark svg { width: 12px; height: 12px; }
.fp-acc { padding-left: 30px; }
.fp-acc .av {
  width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center;
  font-size: 9.5px; font-weight: 640; color: oklch(0.99 0 0); flex-shrink: 0;
}
.fp-foot {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-top: 1px solid var(--border); background: var(--card);
}
.fp-foot .sum { flex: 1; font-size: 11.5px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
.fp-foot .sum b { color: var(--foreground); font-weight: 600; }

/* 三态勾选（全选 / 部分 / 未选）。**勾选区与展开区是两个命中区** ——
   点整行就切换全选，会让「想展开看看有哪些号」这个纯浏览动作顺手清空整组选择。 */
.fcheck {
  width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--border-strong);
  display: grid; place-items: center; flex-shrink: 0; transition: all .12s;
}
.fcheck svg { width: 10px; height: 10px; }
.fcheck.on, .fcheck.part { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }

/* ── 作用域菜单里的「聚合」分组 ──
   分隔线 + 独立分组标题让「聚合 ≠ 第 7 个作用域」在视觉上成立。 */
.scope-menu .sep { height: 1px; margin: 5px 8px; background: var(--border); }
.scope-menu .scope-item .t b .dim { color: var(--muted-fg); font-weight: 400; }

/* ══════════════════════════════════════════════════════════════════════════
   网关页的**两个类型**（issue #76 同期补回，2026-10-22）
   ══════════════════════════════════════════════════════════════════════════
   独立网关 / 统一网关是**同一页的两个类型**（见 `GW_SECTIONS`）：左栏顶部切类型，
   下面切该类型的分区。三种放法都试过（塞进子导航第 7 项 / 升成侧栏独立目的地 /
   当前方案），只有「类型 + 分区」两个轴各归其位这条不产生错位。

   ⚠️ 这套东西此前**只存在于手改的单文件原型里**，而单文件自 2026-10-21 起是
   `npm run proto:single` 的**产物** ⇒ 一次重新生成就全丢了（`verify-unified-pool`
   因此长期是红的）。现在它在源文件里，生成不会再丢。 */
.gw-type-label { font-size: 10.5px; font-weight: 600; letter-spacing: .02em; color: var(--muted-fg); padding: 0 2px 6px; }
.gw-type-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; border-radius: 10px; background: var(--muted); }
.gw-type-seg button { height: 28px; border-radius: 8px; font-size: 12px; color: var(--muted-fg); border: 1px solid transparent; transition: background .14s, color .14s; }
.gw-type-seg button:hover { color: var(--foreground); }
.gw-type-seg button.on { background: var(--card); color: var(--foreground); font-weight: 550; border-color: var(--border); }
@media (max-width: 900px) { .split { flex-direction: column; } .side-col { width: 100%; position: static; } .gw-type-seg { max-width: 320px; } .subnav { width: 100%; flex-direction: row; flex-wrap: wrap; position: static; } .subnav button.on::before { display: none; } }
.uni-ns-groups { display: flex; flex-direction: column; gap: 12px; }
/* ★ 无边框：卡片自身已有边框，再套一层会成三层嵌套边框。 */
.uni-ns-plat { font-size: 11.5px; font-weight: 600; color: var(--muted-fg); margin-bottom: 6px; }
/* ★ 网格而不是 flex-wrap：多行时列对齐，不再参差。 */
.uni-ns-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); gap: 4px 14px; }
.uni-ns { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; padding: 2px 0; min-width: 0; }
.uni-ns input { width: 14px; height: 14px; accent-color: var(--primary); cursor: pointer; margin: 0; }
.uni-ns code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 11.5px; }
/* 勾选项前的池状态点：绿 = 池里有可用账号，红 = 一个可用的都没有。
   用点而不是徽标 —— 勾选区一行放不下第三个徽标，点不挤。 */
.uni-ns-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
/* ★ 客户端名**直接显示**，不再只进 title —— hover 才有人话 = 触屏 / 键盘用户拿不到。 */
.uni-ns-name {
  font-size: 11px; color: var(--muted-fg); min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* 账号池格：**可用数在前**（用户真正要的那个数），不可用项按原因跟在后面。 */
.uni-pool { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.uni-pool-foot { display: flex; align-items: center; gap: 2px; margin-top: 3px; }
.uni-more { margin-top: 9px; }
/* 表格里的展开行（「看清单」/「看池」）共用底色。 */
table.tbl tr.uni-sub td { background: color-mix(in oklab, var(--muted) 45%, transparent); }
/* 就地展开的池明细：内嵌一张小表 —— 不跳页（跳走会丢掉本页唯一的价值：跨平台视野）。 */
.uni-pool-detail { padding: 2px 0; }
.uni-pool-tbl { width: auto; min-width: 340px; }
.uni-pool-tbl th, .uni-pool-tbl td { padding: 4px 16px 4px 0; font-size: 12px; }

/* ══════════════════════════════════════════════════════════════════════════
   密钥权限（issue #76）：行内 chip + 右侧抽屉
   ══════════════════════════════════════════════════════════════════════════
   每把密钥两项策略：**用量配额**（计量单位 token / 请求数，重置周期 不重置 /
   每日 / 每周 / 自然月）与 **可访问账号**（全部账号 / 指定账号白名单，
   可按账号已有的**分组**整组选取）。

   两项都挂在**现有密钥行**上（不新增导航项）—— 权限是密钥的属性，不是新资源。
   真实组件同形：`src/components/gateway/api-key-table.tsx`（三个平台共用）。 */

/* 行内可点 chip：两枚（额度 / 账号），点哪枚就跳到抽屉的哪一段。 */
.kchip {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px;
  border-radius: 7px; font-size: 11px; border: 1px solid var(--border);
  background: var(--card-2); color: var(--muted-fg); white-space: nowrap; transition: all .14s;
}
.kchip:hover { border-color: var(--border-strong); color: var(--foreground); }
.kchip.on { background: color-mix(in oklab, var(--primary) 16%, transparent); border-color: color-mix(in oklab, var(--primary) 38%, transparent); color: var(--primary); }
.kchip.warn { color: var(--warning); border-color: color-mix(in oklab, var(--warning) 40%, transparent); }
.kchip.danger { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 45%, transparent); }
.kchip .dot { width: 6px; height: 6px; border-radius: 3px; background: currentColor; opacity: .75; }

/* 配额进度条：画的是**已用 / 上限**（用户在意的就是「还能用多少」）。
   ★ 2026-10-22 重新设计后列表里只留**一行**：`已用 / 上限` + 3px 迷你条
   （四层文字全塞一列会把行高撑到 4 行，与权限列叠在一起整行密不透风）。 */
.kusage { display: flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
.kusage .kbar { flex: 1; min-width: 28px; height: 3px; border-radius: 2px; background: var(--muted); overflow: hidden; }
.kbar > i { display: block; height: 100%; border-radius: 2px; background: var(--primary); }
.kbar.warn > i { background: var(--warning); }
.kbar.danger > i { background: var(--danger); }

/* 行内展开（点行展开明细）：★ 一次只展开一行 —— 展开区是「低头看详情」，
   同时展开三行就把一览表毁掉了。操作列用 `data-stop` 挡掉冒泡。 */
tr.krow { cursor: pointer; }
tr.krow:hover > td { background: color-mix(in oklab, var(--foreground) 3%, transparent); }
tr.krow-open > td { background: color-mix(in oklab, var(--primary) 7%, transparent); }
tr.krow-detail-row > td { padding: 0 !important; border-top: 0 !important; }
.krow-detail { padding: 10px 12px 11px; background: var(--card-2); border-top: 1px dashed var(--border); }
.krd-row { display: flex; align-items: baseline; gap: 10px; padding: 3px 0; }
.krd-row + .krd-row { border-top: 1px solid var(--border); }
.krd-k { flex-shrink: 0; width: 76px; font-size: 11.5px; color: var(--muted-fg); }
.krd-v { flex: 1; min-width: 0; font-size: 12px; line-height: 1.7; }
.krd-row .btn { flex-shrink: 0; }

/* 抽屉里的账号勾选行与分组 chip。 */
.kacct { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-top: 1px solid var(--border); cursor: pointer; }
.kacct:first-child { border-top: 0; }
.kacct:hover { background: var(--accent); }
.kacct .nm { font-size: 12.5px; }
.klist { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; max-height: 188px; overflow-y: auto; }
.kgrp {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--card-2); font-size: 11.5px; color: var(--muted-fg);
  transition: all .14s;
}
.kgrp:hover { border-color: var(--border-strong); color: var(--foreground); }
.kgrp.on { background: color-mix(in oklab, var(--primary) 16%, transparent); border-color: color-mix(in oklab, var(--primary) 38%, transparent); color: var(--primary); }
.kpicked { display: flex; flex-wrap: wrap; gap: 5px; }
.kpicked .kp {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 6px 0 8px;
  border-radius: 6px; background: var(--muted); font-size: 11.5px;
}
.kpicked .kp button { color: var(--muted-fg); }
.kpicked .kp button:hover { color: var(--foreground); }

/* ══════════════════════════════════════════════════════════════════════════
   账号池：模型熔断条 / 选号说明（2026-10-22 从 3ba8080^ 搬回源文件）
   ══════════════════════════════════════════════════════════════════════════
   两条都是**解释性**构件：回答「为什么这个请求没落到那个号上」。
   颜色沿用语义色（warning = 暂停、primary = 半开试探），不新造调色板。 */
.pool-gate {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 9px 12px; margin-bottom: 12px; border-radius: 10px;
  border: 1px solid color-mix(in oklab, var(--warning) 42%, transparent);
  background: color-mix(in oklab, var(--warning) 10%, transparent);
}
/* 半开：已放行一次试探 ⇒ 换成 primary，与「还在暂停」视觉可分 */
.pool-gate.probe {
  border-color: color-mix(in oklab, var(--primary) 42%, transparent);
  background: color-mix(in oklab, var(--primary) 9%, transparent);
}
.pool-gate b { font-size: 12.5px; }
.pool-gate span { font-size: 11.5px; color: var(--muted-fg); }
.pool-explain {
  margin-top: 10px; padding: 10px 12px; border-radius: 10px;
  background: var(--muted); font-size: 12px; line-height: 1.75;
}
.pool-explain b { font-weight: 600; }
/* 「一个都选不出来」必须红字 + 给出口 —— 灰字会被读成「暂不可用」而不是「配置挡住了」 */
.pool-explain .no { color: var(--destructive); font-weight: 600; }
.pool-explain ul { margin: 4px 0 0; padding-left: 16px; }
.pool-explain li { font-size: 11.5px; color: var(--muted-fg); }
.pool-explain code {
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  font-size: 11px; padding: 0 3px; border-radius: 4px;
  background: color-mix(in oklab, var(--foreground) 7%, transparent);
}
/* 表格里的「在途」：达到上限时用红字（它是**临时**不可选，不是账号坏了） */
td.num.full { color: var(--destructive); font-weight: 600; }

/* ─────────── 设置页「二选一」分段器（issue #109） ───────────
   设置页里这两个标签比常规 `.seg` 长（「直连上游」/「走本机网关」），
   常规内边距会挤成两行；同时补上 disabled 态 —— 冲突时「直连上游」被护栏禁掉，
   而 `.seg` 原本没有 disabled 样式，禁用与可点会长得一样（那等于没禁）。 */
.seg.wide button { padding: 5px 12px; white-space: nowrap; }
.seg button:disabled { cursor: not-allowed; opacity: .45; }
.seg button:disabled:hover { color: var(--muted-fg); }

/* ─────────── CodeBuddy CLI 接入方式（issue #109） ───────────
   这块是「两套凭据通道二选一」，不是偏好开关 —— 所以用**状态条 + 模式卡**，
   而不是设置页常规的 `.srow` + `.seg`。完整设计判断见 `demo-app.js` 里
   `viewCliIntegration()` 的头注释。要点：
     · 分段器的语义是「同一事物的不同取值」（主题：深/浅），可随时来回切、无代价；
       而这里切换会清 token、关轮换、要重启 CLI ⇒ 视觉权重必须更重。
     · 能力差异用 ✓/— **左右对齐**，让两卡可以横着比；写成两段话就没法比。
     · 冲突态把状态条染成警示色并只留一条出路 —— 只禁用按钮而不给下一步，用户会卡住。 */
.mode-strip {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 12px; margin-bottom: 12px;
  border: 1px solid var(--border); background: var(--card);
}
.mode-strip .ms-ico {
  flex: none; width: 30px; height: 30px; border-radius: 9px;
  display: grid; place-items: center; background: var(--muted); color: var(--muted-fg);
}
.mode-strip .ms-ico svg { width: 16px; height: 16px; }
.mode-strip .ms-main { flex: 1; min-width: 0; }
.mode-strip .ms-main b { display: block; font-size: 12.5px; font-weight: 600; }
.mode-strip .ms-main span { display: block; font-size: 11.5px; color: var(--muted-fg); margin-top: 2px; line-height: 1.55; }
.mode-strip .ms-sep { margin: 0 6px; color: var(--faint); }
.mode-strip.ok {
  border-color: color-mix(in oklab, var(--success) 34%, transparent);
  background: color-mix(in oklab, var(--success) 7%, var(--card));
}
.mode-strip.info {
  border-color: color-mix(in oklab, var(--primary) 36%, transparent);
  background: color-mix(in oklab, var(--primary) 7%, var(--card));
}
.mode-strip.warn {
  border-color: color-mix(in oklab, var(--warning) 38%, transparent);
  background: color-mix(in oklab, var(--warning) 8%, var(--card));
}
.mode-strip.warn .ms-ico {
  background: color-mix(in oklab, var(--warning) 18%, transparent); color: var(--warning);
}

.mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 16px 16px; }
@media (max-width: 880px) { .mode-cards { grid-template-columns: 1fr; } }
.mode-card {
  display: flex; flex-direction: column; padding: 14px;
  border: 1px solid var(--border); border-radius: 12px; background: var(--card-2);
  transition: border-color .12s, background .12s;
}
.mode-card.on {
  border-color: color-mix(in oklab, var(--primary) 55%, transparent);
  background: color-mix(in oklab, var(--primary) 6%, var(--card-2));
}
/* 冲突时被护栏挡住的卡：降不透明度而不是隐藏 —— 隐藏会让「这条路存在」这件事消失。 */
.mode-card.off { opacity: .55; }
.mode-card .mc-head { display: flex; align-items: flex-start; gap: 10px; }
.mode-card .mc-ico {
  flex: none; width: 30px; height: 30px; border-radius: 9px;
  display: grid; place-items: center; background: var(--muted); color: var(--muted-fg);
}
.mode-card.on .mc-ico {
  background: color-mix(in oklab, var(--primary) 18%, transparent); color: var(--primary);
}
.mode-card .mc-ico svg { width: 16px; height: 16px; }
.mode-card .mc-ttl { flex: 1; min-width: 0; }
.mode-card .mc-name { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.mode-card .mc-tag { font-size: 11.5px; color: var(--muted-fg); margin-top: 2px; }
.mode-card .mc-cur { flex: none; }
.mode-card ul.cap { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.mode-card ul.cap li { display: flex; align-items: flex-start; gap: 7px; font-size: 11.5px; line-height: 1.5; }
.mode-card ul.cap li svg { width: 13px; height: 13px; margin-top: 1px; flex: none; }
.mode-card ul.cap li.yes { color: var(--foreground); }
.mode-card ul.cap li.yes svg { color: var(--success); }
.mode-card ul.cap li.no { color: var(--faint); }
.mode-card .mc-foot { margin-top: auto; padding-top: 14px; }
.mode-card .mc-foot .btn { width: 100%; justify-content: center; }

.adv-toggle {
  display: flex; align-items: center; gap: 8px; width: 100%;
  appearance: none; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 550;
  color: var(--foreground); background: transparent; border: 0;
  padding: 12px 16px; text-align: left;
}
.adv-toggle:hover { background: oklch(1 0 0 / 4%); }
.adv-toggle .adv-caret { width: 12px; color: var(--muted-fg); }
.adv-body { border-top: 1px solid var(--border); }

/* ══════════════════════ 模型降级链（模型分区内的策略卡）══════════════════════
   为什么是卡片而不是新分区：新增分区要同时改 `GW_SECTIONS`、三个网关页的接线
   与 `check-scope-registry.cjs` 的断言；而卡片零门禁成本，且「降级链」与「模型清单」
   本来就是同一组东西 —— 清单说有哪些模型，降级链说它们挂了怎么办。

   ## 链行为什么是 grid 而不是 flex
   第一列必须按**内容宽度**收：用 `1fr` 会让主模型与箭头之间裂开一大片空白
   （第一版就是这么错的，模型 chip 贴着左边、箭头飘在中间）。备选列吃剩余空间，
   触发标签靠右 —— 三者的宽度语义不同，grid 才能一次说清。 */
.fb-list { padding: 0 16px; }

.fb-chain {
  display: grid;
  grid-template-columns: auto 18px minmax(0, 1fr) auto;
  align-items: center; gap: 9px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.fb-chain:last-child { border-bottom: 0; }
/* 停用的链整行变暗但仍可见（与「禁用模型」同一套语言：用户要知道它存在、可随时启用）。 */
.fb-chain.is-off { opacity: .6; }
.fb-chain:hover { background: color-mix(in oklab, var(--accent) 45%, transparent); }
.fb-chain:hover .fb-side { opacity: 1; }

.fb-model {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 11.5px;
  background: var(--card-2); border: 1px solid var(--border);
  border-radius: 7px; padding: 3px 8px; max-width: 100%;
}
.fb-model .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 源模型用主色描边：一眼分出「从谁降到谁」，不必读两遍名字。 */
.fb-model.src {
  border-color: color-mix(in oklab, var(--primary) 38%, transparent);
  background: color-mix(in oklab, var(--primary) 10%, var(--card-2));
}

/* 状态点 = **实时健康态**（不是静态标记）。这是整个卡片里最关键的一个元素：
   它回答用户唯一真正关心的问题 ——「我这条链现在真的能救我吗」。 */
.fb-dot { width: 6px; height: 6px; border-radius: 999px; flex: none; background: var(--muted-fg); }
.fb-dot.ok { background: var(--success); }
.fb-dot.warn { background: var(--warning); }
.fb-dot.off { opacity: .45; }

.fb-arrow { color: var(--muted-fg); font-size: 12px; text-align: center; opacity: .7; }
.fb-targets { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.fb-sep { color: var(--muted-fg); opacity: .45; font-size: 11px; }
.fb-add {
  font-size: 11px; color: var(--muted-fg); border: 1px dashed var(--border-strong);
  border-radius: 7px; padding: 3px 8px; background: transparent;
}
.fb-add:hover { color: var(--foreground); border-color: var(--primary); }

.fb-side { display: flex; align-items: center; gap: 8px; opacity: .85; transition: opacity .12s; }
.fb-tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 200px; }
.fb-tag {
  font-size: 10px; color: var(--muted-fg); background: var(--card-2);
  border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; white-space: nowrap;
}

/* 诊断带贴在链行**下方**，而不是弹 toast：降级链的问题几乎全是「配置对了但不会生效」
   （目标也在闸门里 / 目标能力不匹配 / 环路），这类问题必须在**配置的那一刻**看得见。 */
.fb-diag {
  grid-column: 1 / -1; display: flex; align-items: flex-start; gap: 6px;
  margin-top: 3px; padding: 7px 9px; border-radius: 8px;
  font-size: 11px; line-height: 1.6;
}
.fb-diag svg { width: 12px; height: 12px; flex: none; margin-top: 2px; }
.fb-diag.warn {
  color: color-mix(in oklab, var(--warning) 85%, var(--foreground));
  background: color-mix(in oklab, var(--warning) 10%, transparent);
  border: 1px solid color-mix(in oklab, var(--warning) 26%, transparent);
}
.fb-diag.info { color: var(--muted-fg); background: var(--card-2); border: 1px solid var(--border); }

/* ── 抽屉：模拟路径用**纵向时序**，不是横向箭头链 ──
   560px 窗宽下横向链必然折行，折完就看不出顺序了（设计稿第一版实测）。 */
.fb-sim { border: 1px solid var(--border); border-radius: 10px; background: var(--card-2); padding: 10px 12px; }
.fb-sim .h {
  font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-fg);
}
.fb-step {
  display: grid; grid-template-columns: 14px minmax(0, 1fr) 48px auto;
  align-items: center; gap: 8px; padding: 5px 0; font-size: 11.5px;
}
.fb-step + .fb-step { border-top: 1px solid var(--border); }
.fb-step .n { font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: var(--muted-fg); text-align: center; }
.fb-step .m { font-family: ui-monospace, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb-step .r { font-size: 10.5px; color: var(--muted-fg); }
.fb-step .s { font-size: 10.5px; text-align: right; white-space: nowrap; }
.fb-step .s.warn { color: var(--warning); }
.fb-step .s.ok { color: var(--success); }

.fb-slot { display: flex; align-items: center; gap: 6px; }
.fb-slot .i { font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: var(--muted-fg); width: 14px; text-align: right; flex: none; }
.fb-slot select { flex: 1; min-width: 0; }

</style>
</head>
<body>

<div class="app">

  <!-- ══════════════ 顶部应用栏：L1 作用域 ══════════════ -->
  <header class="topbar">
    <button class="scope-trigger" id="scope-trigger" aria-haspopup="menu" aria-expanded="false">
      <span class="scope-mark" id="scope-mark"></span>
      <span class="scope-text">
        <span class="scope-name" id="scope-name">WorkBuddy 国内版</span>
        <span class="scope-sub" id="scope-sub">jackey@example.com · 8 个账号</span>
      </span>
      <span class="scope-caret" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </span>
    </button>

    <span class="run-pill" id="run-pill"><i class="dot"></i><span>运行中</span></span>

    <div class="topbar-spacer"></div>

    <button class="search-btn" id="search-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>搜索账号、页面或动作</span>
      <kbd>⌘K</kbd>
    </button>

    <button class="icon-btn" id="refresh-btn" title="刷新当前作用域">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="icon-btn" id="theme-btn" title="切换明暗主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
    </button>
    <button class="icon-btn" id="app-settings-btn" title="应用设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
  </header>

  <div class="body">

    <!-- ══════════════ 侧栏：L2 目的地（固定 5 项，不随平台换血） ══════════════ -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-text">
          <b>Buddy Switch</b>
          <i>多平台账号管理</i>
        </span>
      </div>

      <nav class="nav" id="nav" aria-label="目的地导航"></nav>

      <div class="sidebar-foot">
        <div class="ver-row">
          <i class="dot" id="foot-dot"></i>
          <!-- 版本号由 demo-app.js 从 APP_UPDATE.current 回填：与升级弹窗里的「当前版本」同源 -->
          <span id="foot-ver">v—</span>
          <button class="mini-btn" title="会话悬浮窗" data-act="cp-toggle" aria-label="显示或隐藏会话悬浮窗">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </button>
          <button class="mini-btn" title="检查更新" data-act="check-update">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <!-- 侧栏折叠开关：**最底部**（版本行之下）—— 顶部品牌区不放控件（身份区），
           底部边缘是「抽屉把手」的位置（VS Code 同款思路）。收起时它自己就是「展开」按钮。 -->
      <button class="side-toggle" id="side-toggle" data-act="side-toggle" aria-expanded="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        <span class="nav-label">收起侧栏</span>
      </button>
    </aside>

    <!-- ══════════════ 内容区：L3 视图参数 ══════════════ -->
    <main class="content" id="content"></main>
  </div>
</div>

<!-- 作用域菜单 -->
<div class="scope-menu" id="scope-menu" role="menu" aria-hidden="true"></div>

<!-- 命令面板 -->
<div class="overlay" id="palette-overlay" aria-hidden="true">
  <div class="palette" role="dialog" aria-label="命令面板">
    <div class="palette-input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="palette-input" type="text" placeholder="搜索账号、切换作用域、跳转页面或执行动作…" autocomplete="off" />
      <kbd>ESC</kbd>
    </div>
    <div class="palette-list" id="palette-list"></div>
  </div>
</div>

<!-- 右侧抽屉 -->
<div class="drawer-overlay" id="drawer-overlay" aria-hidden="true"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header class="drawer-head">
    <div class="drawer-title" id="drawer-title">标题</div>
    <button class="icon-btn" id="drawer-close" title="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>
  <div class="drawer-body" id="drawer-body"></div>
  <footer class="drawer-foot" id="drawer-foot"></footer>
</aside>

<!-- 升级前说明弹窗（版本内容）：侧栏 ↑ 或应用设置里的「检查更新」进入。
     内容由 demo-app.js 的 renderUpdateDialog() 写入 —— 阶段（说明 / 下载 / 就绪 / 失败）
     全在同一枚弹窗里切换，不另开抽屉。 -->
<div class="overlay upd-overlay" id="update-overlay" aria-hidden="true"></div>

<!-- 不可逆操作确认 Dialog -->
<div class="overlay" id="confirm-overlay" aria-hidden="true">
  <div class="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <h3 id="confirm-title">确认</h3>
    <p id="confirm-body"></p>
    <div class="confirm-actions">
      <button class="btn" id="confirm-cancel" data-act="confirm-cancel">取消</button>
      <button class="btn danger" id="confirm-ok" data-act="confirm-ok">确认</button>
    </div>

/* ─────────── 作用域 = 平台 × 区域 ─────────── */
/* ─────────── 会话树 / 资源包 / 签到历史 ───────────
   用生成器保持数据紧凑：每个账号一组三层会话树（类型 → 目录 → 会话），
   一组资源包明细，以及近 7 天签到历史。种子取自账号 id，保证稳定可复现。 */
const SESSION_SEEDS = {
  types: ["对话", "工作区", "claw"],
  /* 目录名「像文件夹」，会话名「像任务标题」——两个池不共用字符串，

    "account-pool", "snapshot-design", "session-tree", "perm-guide",
    "credit-rotation", "oauth-callback", "tray-autostart", "settings-flags"],
  sessions: ["重构 Tauri 命令面", "修复 SPA 深链 MIME", "网关 Key 生命周期", "CI 四平台矩阵",

    "深链即唯一真值", "能力开关驱动 UI", "统一错误态", "批量部分失败汇总"],
};
function _rng(seedStr) {
  let h = 0; for (const ch of seedStr) h = (h * 31 + ch.charCodeAt(0)) % 997;
  return () => { h = (h * 1103515245 + 12345) & 0x7fffffff; return h; };
}
function _pick(arr, n, rnd) {
  const used = new Set(), out = [];
  while (out.length < n && used.size < arr.length) { const i = rnd() % arr.length; if (!used.has(i)) { used.add(i); out.push(arr[i]); } }
  return out;
}
function makeSessionTree(seedStr) {
  const rnd = _rng(seedStr);
  return SESSION_SEEDS.types.map((type) => ({
    type,
    dirs: _pick(SESSION_SEEDS.dirs, 2 + (rnd() % 2), rnd).map((name) => ({
      name,
      sessions: _pick(SESSION_SEEDS.sessions, 2 + (rnd() % 3), rnd).map((title) => ({ title, msgs: 6 + (rnd() % 42) })),
    })),
  }));
}
function makePacks(seedStr, credits, creditsTotal) {
  const rnd = _rng(seedStr + "p");
  const n = 2 + (rnd() % 3);
  /* 包名先洗牌再取前 n 个，保证同一账号内不出现重名资源包。 */
  const names = _pick(["新手礼包", "月度订阅", "活动赠送", "团队共享", "年度包"], n, rnd);

  /* ① 先定每个包的**总量**（最后一包吃余数 ⇒ 合计恒等于 creditsTotal）。 */
  const packs = [];
  let totLeft = creditsTotal;
  for (let i = 0; i < n; i++) {
    const tot = i === n - 1 ? Math.max(0, totLeft) : Math.round(creditsTotal / n);
    totLeft -= tot;
    packs.push({ name: names[i], total: tot, remaining: tot });
  }

  /* ② 再把「已用掉的量」随机摊到各包上 —— 之前每包都写 `credits / n`，
        结果一屏四行全是「310 / 500 · 已用 190」，进度条一模一样，
        既不像真实发放（有的包没动、有的用掉大半），也让设计评审看不出条形图的差异。
        ⚠️ 摊完的合计必须**精确**等于 `credits`（否则「积分」指标块与包明细对不上）。 */
  let used = creditsTotal - Math.min(credits, creditsTotal);
  const order = packs.map((_, i) => i).sort(() => rnd() - 0.5);
  for (const i of order) {
    if (used <= 0) break;
    const p = packs[i];
    /* 每包用掉 20%~90%（而不是固定 90%）：额度紧的账号（如 120/2000）否则会变成
       「每包都恰好用 450」的一排相同进度条 —— 那正是这版要修掉的观感。 */
    const take = Math.min(Math.floor(p.total * (0.2 + rnd() * 0.7)), used);
    p.remaining = p.total - take;
    used -= take;
  }
  /* ③ 还有没摊完的（都被上限挡住时）继续往后摊，允许把包用光 ——
        ⚠️ 必须摊完：`sum(remaining)` 要**精确**等于 `credits`，否则指标块与包明细对不上
        （曾经把余量一次性压到最后一包，被 clamp 吃掉几百，合计就漂了）。 */
  for (const p of packs) {
    if (used <= 0) break;
    const take = Math.min(p.remaining, used);
    p.remaining -= take;
    used -= take;
  }

  /* ④ 到期：`expireAt`（毫秒）是真实后端 `CreditResource.expireAt` 的对应字段 ——
        抽屉的「积分 / 资源包」要显示「到期 10-24 12:00」，只有天数不够。
        抖动 ±6.5h 让到期时刻看起来像真的发放时间，而不是每包都「今天此刻 + N 天」。 */
  for (let i = 0; i < packs.length; i++) {
    const p = packs[i];
    /* 第一包约一半概率落在 7 天内 ⇒ 演示里能看到「临期」的橙色条与卡片徽章；
       其余包 2~61 天，保证「未临期」也始终有样本（颜色断言需要两种都在）。 */
    const days = i === 0 && rnd() < 0.55 ? 2 + (rnd() % 6) : 2 + (rnd() % 60);
    const jitterMs = ((rnd() % 780) - 390) * 60000;
    p.expireAt = Date.now() + days * 86400000 + jitterMs;
    p.expireInDays = Math.max(1, Math.ceil((p.expireAt - Date.now()) / 86400000));
  }
  return packs;
}
function makeCheckinHistory(seedStr) {
  const rnd = _rng(seedStr + "c");
  const today = new Date();
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(today.getTime() - i * 86400000);
    return { date: `${d.getMonth() + 1}/${d.getDate()}`, ok: rnd() % 7 !== 0 };
  });
}

function makeAccount(id, name, email, o) {
  const a = Object.assign({
    id, name, email, remark: "", group: "默认",
    credits: 1200, creditsTotal: 2000,
    checkedIn: true, expired: false, needsRelogin: false, priority: false,
    programs: {}, lastUsed: "刚刚", lastUsedTs: Date.now(),
    todayTokens: 0, totalTokens: 0, status: "ok",
    snapshots: [],
  }, o || {});
  a.sessionTree = a.sessionTree || makeSessionTree(id);
  a.packs = a.packs || makePacks(id, a.credits, a.creditsTotal);
  /* 「临期积分 / 最近到期」**从资源包派生**，不再手写在账号字面量里。
     真实后端的 `expiringSoonRemaining` 也是这么算的；手写会与包明细打架 ——
     a2 就出现过「指标块说无临期积分、积分页却摆着一个 10-20 到期的包」。
       · expiring      = 7 天内到期的包里还剩多少（卡片徽章 + 指标块用）
       · expireInDays  = 这些包里最早到期的天数（没有临期包时退回全部包里最近的） */
  const _now = Date.now();
  const _soon = a.packs.filter((p) => p.remaining > 0 && p.expireAt && p.expireAt - _now <= 7 * 86400000);
  a.expiring = _soon.reduce((sum, p) => sum + p.remaining, 0);
  const _live = a.packs.filter((p) => p.remaining > 0 && p.expireAt);
  a.expireInDays = _soon.length
    ? Math.min(..._soon.map((p) => Math.ceil((p.expireAt - _now) / 86400000)))
    : (_live.length ? Math.min(..._live.map((p) => Math.ceil((p.expireAt - _now) / 86400000))) : null);
  a.checkinHistory = a.checkinHistory || makeCheckinHistory(id);
  return a;
}

/* ─────────── 用量数据 ─────────── */
/* lastValue：最后一天（今天）的真实值。传入时用它，而不是 base*1.12——
   保证「概览统计块 = 趋势图末柱 = 账号卡今日 Token 合计」三者一致。 */
function series(days, base, seed, lastValue) {
  const out = [];
  const today = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today.getTime() - i * 86400000);
    const wobble = Math.sin((i + seed) * 1.7) * 0.35 + Math.cos((i + seed) * 0.6) * 0.22;
    const v = Math.max(0, Math.round(base * (1 + wobble)));
    out.push({
      label: `${d.getMonth() + 1}/${d.getDate()}`,
      value: i === 0 ? (lastValue == null ? Math.round(base * 1.12) : lastValue) : v,
    });
  }
  return out;
}

/* 积分流水：`when` 只用于显示；`ts` 是真实时间戳（按分钟偏移），排序只看 ts——
   否则「今天 / 昨天 / 3 天前」按中文字符串排会乱序。 */
const _nowTs = Date.now();
function credit(when, minsAgo, account, delta, note) {
  return { when, ts: _nowTs - minsAgo * 60000, account, delta, note };
}

/* ─────────── 用量派生数据 ───────────
   全部**从已有数据推导**（days / models / sessions / accounts / gatewayRequests），
   **绝不手写新数字**——否则又会冒出「同一件事两处数值打架」那类不自洽。
   推导结果挂在 `USAGE[scope].ext`，由文件末尾统一调用。

   一条硬约束：**堆叠柱各分段之和必须精确等于当日总量**（最后一段吃掉舍入余数），
   否则「堆叠柱总高」与「单色柱高度」会对不上，是能被一眼看穿的假数据。 */
/* ─────────── 网关账本（issue #63）───────────
   设计依据：`docs/specs/USAGE-GATEWAY-UI-REDESIGN.md`。
   三条硬约束，改这里之前先读：
   ① **按模型 / 按账号 / 按端点三者的合计必须都等于网关总量**（否则页面上的「按模型合计 = 网关卡」当场破功）；
   ② **对账结果必须与 `proxy` 一致**：`proxy:true` ⇒ 客户端 ⊆ 网关（匹配率 ~92%，判 subset）；
      `proxy:false` ⇒ 两本账独立（匹配率 ~6%，判 independent）。这是这个设计要证明的那件事；
   ③ 积分同理：余额口径（consumed）**恒大于**请求口径（byRequest），差额是「未归因」，
      绝不能被摊到任何来源上。 */
function buildLedger(scopeId, u, modelDays) {
  const scope = SCOPES[scopeId];
  const proxied = Boolean(scope.proxy);

  const clientDays = u.days.map((d) => d.value);
  const clientTokens = clientDays.reduce((a, b) => a + b, 0);
  const gwFactor = proxied ? 5.6 : 1.4;

  /* 网关逐日：按客户端的形状放大，末位吃余数保证合计一致 */
  const gwRaw = clientDays.map((v, i) => v * gwFactor * (0.82 + ((i * 31) % 40) / 100));
  const gwRawSum = gwRaw.reduce((a, b) => a + b, 0) || 1;
  const gatewayTokens = Math.round(clientTokens * gwFactor);
  let accGw = 0;
  const gatewayDays = gwRaw.map((v, i) => {
    const out = i === gwRaw.length - 1 ? gatewayTokens - accGw : Math.round((v / gwRawSum) * gatewayTokens);
    accGw += out;
    return Math.max(0, out);
  });

  /* 网关模型：客户端模型放大 + 一个「仅网关」的 auto（真实网关里 auto 路由会出现） */
  const rawModels = u.models.length
    ? u.models.map((m, i) => ({ name: m.name, w: m.tokens * (i === 0 ? 1.3 : 0.62) }))
    : [{ name: "claude-sonnet-4.5", w: 1 }];
  rawModels.push({ name: "auto", w: gatewayTokens * 0.004 });
  const modelW = rawModels.reduce((a, m) => a + m.w, 0) || 1;
  let accM = 0;
  const gatewayModels = rawModels.map((m, i) => {
    const out = i === rawModels.length - 1
      ? gatewayTokens - accM
      : Math.round((m.w / modelW) * gatewayTokens);
    accM += out;
    const req = Math.max(1, Math.round(out / 148000));
    return { name: m.name, tokens: Math.max(0, out), req };
  });

  /* 网关的**逐日 × 模型**拆分（「模型」tab 的每日按模型堆叠图要用）。
     与 modelDays 同一手法：每天按权重摊，末位吃余数 ⇒ 每列之和 === 当日网关总量。 */
  const gwModelDays = gatewayModels.map((m) => ({ name: m.name, values: [] }));
  gatewayDays.forEach((dayTotal, i) => {
    const w = gatewayModels.map((m, k) => m.tokens * (0.8 + ((i * 29 + k * 47) % 40) / 100));
    const wsum = w.reduce((a, b) => a + b, 0) || 1;
    let acc = 0;
    gatewayModels.forEach((m, k) => {
      const v = k === gatewayModels.length - 1 ? Math.max(0, dayTotal - acc) : Math.round((dayTotal * w[k]) / wsum);
      acc += v;
      gwModelDays[k].values.push(Math.max(0, v));
    });
  });

  /* 网关账号：取本作用域前 3 个账号按 5:3:2 摊 */
  const accNames = (scope.accounts || []).slice(0, 3).map((a) => a.name);
  const shares = [0.52, 0.34, 0.14];
  let accA = 0;
  const gatewayAccounts = (accNames.length ? accNames : ["unknown"]).map((name, i, arr) => {
    const out = i === arr.length - 1 ? gatewayTokens - accA : Math.round(gatewayTokens * (shares[i] ?? 0.1));
    accA += out;
    return { name, tokens: Math.max(0, out), req: Math.max(1, Math.round(out / 148000)) };
  });

  /* 端点：chat 96% / messages 2% / responses 2% */
  const gatewayRows = Math.max(1, Math.round(gatewayTokens / 148000));
  const epChat = Math.round(gatewayRows * 0.96);
  const epMsg = Math.round(gatewayRows * 0.02);
  const gatewayEndpoints = [
    { name: "/v1/chat/completions", req: epChat },
    { name: "/v1/messages", req: epMsg },
    { name: "/v1/responses", req: Math.max(0, gatewayRows - epChat - epMsg) },
  ];

  /* 对账 */
  const clientRows = Math.max(1, Math.round(clientTokens / 42000));
  const matchedRatio = proxied ? 0.92 : 0.06;
  const matched = Math.round(clientRows * matchedRatio);
  const matchedTokens = Math.round(clientTokens * matchedRatio);
  const verdict = proxied ? "subset" : "independent";
  const failed = Math.max(1, Math.round(gatewayRows * 0.04));

  /* 积分：两个口径（余额口径 = 请求口径 + 未归因） */
  const creditOf = (tokens) => +(tokens / 34000).toFixed(1);
  const clientCredit = creditOf(clientTokens);
  const gatewayCredit = creditOf(gatewayTokens);
  const overlapCredit = +(clientCredit * matchedRatio).toFixed(1);
  const byRequest = +(clientCredit + gatewayCredit - overlapCredit).toFixed(1);
  const gap = +(byRequest * 0.06).toFixed(1);
  const consumed = +(byRequest + gap).toFixed(1);

  /* 客户端模型用量**必须取 modelDays 的逐日合计**：`u.models[].tokens` 是示意量，
     不等于 days 的合计 —— 拿它算占比会得出「五个模型加起来只有 34%」。 */
  const clientModelTotals = (modelDays || []).map((m) => ({
    name: m.name,
    tokens: m.values.reduce((a, b) => a + b, 0),
  }));
  const creditShare = (list, total, totalCredit) =>
    list.map((m) => ({
      name: m.name,
      v: +(totalCredit * (m.tokens / (total || 1))).toFixed(1),
      /* 客户端模型没有请求数字段（modelDays 只存逐日 Token）⇒ 按均值折算，别写成 0。 */
      req: m.req ?? Math.max(1, Math.round((m.tokens || 0) / 42000)),
    }));
  const dailyCredit = (values, totalTokens, totalCredit) =>
    values.map((v) => +(totalCredit * (v / (totalTokens || 1))).toFixed(1));

  return {
    proxied, verdict,
    client: { tokens: clientTokens, requests: clientRows, days: clientDays },
    gateway: {
      tokens: gatewayTokens, requests: gatewayRows, failed,
      days: gatewayDays, models: gatewayModels, modelDays: gwModelDays,
      accounts: gatewayAccounts, endpoints: gatewayEndpoints,
      coverage: `${u.days.length}/${u.days.length} 天`,
    },
    recon: { clientRows, gatewayRows, matched, matchedTokens, ratio: matchedRatio },
    credits: {
      client: clientCredit, gateway: gatewayCredit, overlap: overlapCredit,
      byRequest, consumed, gap,
      clientModels: creditShare(clientModelTotals, clientTokens, clientCredit),
      gatewayModels: creditShare(gatewayModels, gatewayTokens, gatewayCredit),
      dailyClient: dailyCredit(clientDays, clientTokens, clientCredit),
      dailyGateway: dailyCredit(gatewayDays, gatewayTokens, gatewayCredit),
    },
  };
}

function buildUsageExtras(scopeId) {
  const u = USAGE[scopeId];
  const scope = SCOPES[scopeId];

  /* 1. 每个模型的每日序列（堆叠柱用） */
  const weights = u.models.map((m) => m.tokens);
  const modelDays = u.models.map((m) => ({ name: m.name, values: [] }));
  u.days.forEach((d, i) => {
    const w = weights.map((t, k) => t * (0.78 + ((i * 37 + k * 53) % 44) / 100));
    const wsum = w.reduce((a, b) => a + b, 0) || 1;
    let acc = 0;
    u.models.forEach((m, k) => {
      const v = k === u.models.length - 1 ? Math.max(0, d.value - acc) : Math.round((d.value * w[k]) / wsum);
      acc += v;
      modelDays[k].values.push(Math.max(0, v));
    });
  });

  /* 2. 时段热力图：7 天(周一..周日) × 24 小时，取**相对强度 0–100**。
        刻意不声称是绝对 Token，避免与 days 的口径冲突。 */
  const hourly = Array.from({ length: 7 }, (_, wd) =>
    Array.from({ length: 24 }, (_, h) => {
      const weekend = wd >= 5 ? 0.42 : 1;
      const shape = h < 7 ? 0.05 : h < 9 ? 0.42 : h < 12 ? 1 : h < 14 ? 0.66 : h < 19 ? 0.94 : h < 22 ? 0.46 : 0.12;
      return Math.round(shape * weekend * (72 + ((h * 13 + wd * 29) % 28)));
    })
  );

  /* 3. 每日积分收支。入账用**该作用域真实的签到奖励**（WB=100 / Trae=50），别硬编码。 */
  const reward = scope.checkinReward || 100;
  const creditDaily = u.days.map((d, i) => ({
    label: d.label,
    inAmt: i % 7 === 6 ? 0 : reward,      // 周日不签到
    outAmt: Math.round(d.value / 2600),   // 由 Token 量推导消耗
  }));

  /* 4. 积分余额曲线：以「当前余额合计」为**终值**往前回推 ⇒ 末值必然对得上统计块。 */
  const curTotal = scope.accounts.reduce((s, a) => s + a.credits, 0);
  const net = creditDaily.map((c) => c.inAmt - c.outAmt);
  let bal = curTotal - net.reduce((a, b) => a + b, 0);
  const balance = net.map((v, i) => { bal += v; return { label: creditDaily[i].label, value: Math.max(0, bal) }; });

  /* 5. 到期分布：由账号的 expiring / expireInDays 聚合，与「即将过期」统计块**同源**。 */
  const expiry = Array.from({ length: 30 }, (_, i) => ({ day: i + 1, value: 0 }));
  scope.accounts.forEach((a) => {
    if (a.expiring > 0 && a.expireInDays >= 1 && a.expireInDays <= 30) expiry[a.expireInDays - 1].value += a.expiring;
  });

  /* 6. 账号 Token 占比（环形图） */
  const accountShare = scope.accounts
    .filter((a) => a.totalTokens > 0)
    .map((a) => ({ name: a.name, value: a.totalTokens }))
    .sort((x, y) => y.value - x.value);

  /* 7. 网关状态码分布：由 gatewayRequests 推导，与概览的「网关请求」**同源**。 */
  const rq = scope.gatewayRequests || 0;
  const statusCodes = rq
    ? [
        { name: "200 成功", value: Math.round(rq * 0.94) },
        { name: "429 限流", value: Math.round(rq * 0.042) },
        { name: "5xx 上游错误", value: Math.max(1, Math.round(rq * 0.018)) },
      ]
    : [];

  /* 8. 会话散点：x = 消息数，y = Token（气泡大小随 Token） */
  const scatter = u.sessions.map((s) => ({ x: s.msgs, y: s.tokens, label: s.title }));

  /* ★ 积分两个口径必须**同一个量级**：余额口径取 `creditDaily.outAmt` 的合计（权威），
     请求口径按 token 折算出来，两者若各写一套数，差额会大到像 bug（实测 57%）。
     ⇒ 按比例把请求口径缩放到「余额口径 / 1.06」，让差额稳定在 ~6%（= 未归因）。 */
  const ledger = buildLedger(scopeId, u, modelDays);
  const consumedOut = creditDaily.reduce((a, d) => a + d.outAmt, 0);
  const target = consumedOut / 1.06;
  const k = ledger.credits.byRequest ? target / ledger.credits.byRequest : 1;
  for (const key of ["client", "gateway", "overlap", "byRequest"]) {
    ledger.credits[key] = +(ledger.credits[key] * k).toFixed(1);
  }
  for (const list of [ledger.credits.clientModels, ledger.credits.gatewayModels]) {
    for (const m of list) m.v = +(m.v * k).toFixed(1);
  }
  ledger.credits.dailyClient = ledger.credits.dailyClient.map((v) => +(v * k).toFixed(1));
  ledger.credits.dailyGateway = ledger.credits.dailyGateway.map((v) => +(v * k).toFixed(1));
  ledger.credits.consumed = +consumedOut.toFixed(1);
  ledger.credits.gap = +Math.max(0, consumedOut - ledger.credits.byRequest).toFixed(1);

  return { modelDays, hourly, creditDaily, balance, expiry, accountShare, statusCodes, scatter, curTotal, ledger };
}

     ★ 一次只展开一行 —— 展开区是「低头看详情」，同时展开三行就把一览表毁掉了。
     纯本地状态，不发请求；点同一行再点一次即收起。 */
  keyExpand: null,
  /* 抽屉 */
  drawer: null,        // { kind, id, step, ... }
  /* 命令面板 */
  palette: { open: false, q: "", cursor: 0 },
  loading: false,
  /* 错误态：键为场景（gateway / usage），为 true 时对应页面渲染行内错误态。
     用可寻址状态驱动，才能用 ?err=gateway 深链复现。 */
  errors: {},
  /* 桌面悬浮窗是否显示（§3.16 / D21）：入口在侧栏左下角 + 托盘。 */
  companionOpen: true,
  /* 请求代理开关（§3.19 / P12）：**默认关**（D29 拍板）。 */
  proxyOn: false,
  /* 最近一次批量签到的结果：{ ok, failIds }。null 表示没有可展示的汇总。 */
  checkinResult: null,
  /* 随机抖动（issue #27 的「另一支」）：**默认关** —— 打开才改变触发时刻，
     默认值不动任何既有行为。幅度三档见 `JITTER_STEPS`。 */
  jitter: { on: false, minutes: 15 },
  /* 全局备份（§3.14）：parts 懒初始化为「全部作用域 × 全部内容」。
     creds 默认 false —— 安全默认，与 §2.5「默认拒绝」同源。 */
  backup: {
    parts: {},
    creds: false,

  update: { open: false, stage: "available", progress: 0, olderOpen: false, seenVersion: null },

/* ─────────── 工具 ─────────── */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/* 邮箱脱敏（§3.3 / D22 已拍板）：本地段只留首字符。
   这是**展示层的隐私默认**，不是安全边界 —— 真实值仍在本地库，
   防的是截图 / 投屏 / 求助时泄露完整邮箱（本项目的用户经常贴截图报障）。
   ⚠️ 搜索用**原值**，展示用**脱敏值**：两者不能混。 */
const maskEmail = (email) => {
  const s = String(email || "");
  const at = s.indexOf("@");
  if (at <= 0) return s;
  const local = s.slice(0, at);
  return local.slice(0, 1) + "*".repeat(Math.max(3, local.length - 1)) + s.slice(at);
};

const fmt = (n) => Number(n || 0).toLocaleString("zh-CN");
/* 资源包数量：最多两位小数、去掉多余的 0（1000 → 1,000；30.86 → 30.86；6 → 6）。 */
const fmtQty = (n) => Number(Number(n || 0).toFixed(2)).toLocaleString("zh-CN", { maximumFractionDigits: 2 });
/* 到期时刻：MM-DD HH:mm —— 资源包最多几十天到期，再带年份是噪声。 */
function fmtMonthDay(ts) {
  const d = new Date(ts);
  if (!Number.isFinite(ts) || Number.isNaN(d.getTime())) return "";
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const fmtTok = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n || 0));
const curScope = () => SCOPES[state.scope];
const curPlatform = () => PLATFORMS[curScope().platform];
/* 展示名的拼装**只有一处实现**（`demo-data.js` 的 `scopeDisplayName`）——
   这里只是取个短名字，方便页面代码继续读作 `scopeLabel(...)`。 */
const scopeLabel = (id) => scopeDisplayName(id);
const currentAccount = (id) => {
  const s = SCOPES[id];
  const p = PLATFORMS[s.platform];
  return s.accounts.find((a) => a.programs[p.programs[0].id]) || null;
};
const expiredCount = (s) => s.accounts.filter((a) => a.expired || a.needsRelogin).length;

/* ─────────── 账号键（`${scope}:${id}`）───────────
   聚合页一张卡一个账号，6 个作用域共存 ⇒ **裸 id 会串号**（同一 `userId` 在国内 / 国际
   是两个不同账号）。所有「指向某个账号」的引用统一走这套 ref：
     · 账号页生成裸 id（`a1`）—— 既有 DOM 断言与行为完全不变；
     · 聚合页生成 `${scope}:${a1}`。
   `refScope()` 对裸 id 回落到 `state.scope`，因此两边共用同一套事件分支。 */
const refOf = (scope, id) => `${scope}:${id}`;
const refScope = (ref) => (String(ref).includes(":") ? String(ref).slice(0, String(ref).indexOf(":")) : state.scope);
const refId = (ref) => (String(ref).includes(":") ? String(ref).slice(String(ref).indexOf(":") + 1) : String(ref));
const refAccount = (ref) => SCOPES[refScope(ref)].accounts.find((x) => x.id === refId(ref)) || null;
const refPlatform = (ref) => PLATFORMS[SCOPES[refScope(ref)].platform];

/* 聚合页的账号全集（顺序 = SCOPES 声明顺序，因此分组视图的组序稳定）。 */
const aggAll = () => Object.keys(SCOPES).flatMap((sid) => SCOPES[sid].accounts.map((a) => ({ scope: sid, a, ref: refOf(sid, a.id) })));
const aggAllRefs = () => new Set(aggAll().map((x) => x.ref));
/* 「需处理」= 过期 / 需重登 / 未签到。与账号页 `expiredCount` 的口径**不同**：
   后者只数凭据问题（侧栏徽章说的是「凭据待处理」），聚合页顶部说的是「今天有事要做」。 */
const aggNeedsAttention = (a) => Boolean(a.expired || a.needsRelogin || !a.checkedIn);
/* 紧迫度：平铺视图的排序依据。若平铺只是「打散分组、顺序仍按作用域」，它没有任何新信息。 */
const aggUrgency = (a) => (a.expired ? 0 : a.needsRelogin ? 1 : !a.checkedIn ? 2 : a.expiring ? 3 : 4);

function avatarTone(name) {
  /* 亮度压到 L ≤ 0.5，压在上面的白字（oklch .99）才能过 AA 4.5:1。
     色相保持不变，只降亮度。 */
  const tones = ["oklch(0.5 0.13 163)", "oklch(0.48 0.14 265)", "oklch(0.5 0.13 300)", "oklch(0.5 0.14 60)", "oklch(0.48 0.13 20)", "oklch(0.5 0.12 220)"];
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 997;
  return tones[h % tones.length];
}
const initials = (name) => (name || "?").replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, "").slice(0, 2).toUpperCase();

/* ─────────── toast ─────────── */
let toastSeq = 0;
/* note：写给评审看的「原型说明」，与面向用户的产品文案视觉分离（.proto-note）。 */
function toast(kind, title, desc, action, note) {
  const id = "t" + ++toastSeq;
  const ico = kind === "err" ? ICON.warn : ICON.check;
  const node = document.createElement("div");
  node.className = "toast " + (kind === "err" ? "err" : "ok");
  node.id = id;
  node.innerHTML = `<span class="ico">${ico}</span><span class="t"><b>${esc(title)}</b>${desc ? `<span>${esc(desc)}</span>` : ""}${note ? `<span class="proto-note">${esc(note)}</span>` : ""}</span>` +
    (action ? `<button class="btn xs" data-act="toast-action|${id}">${esc(action.label)}</button>` : "");
  $("#toasts").appendChild(node);
  if (action) pendingActions[id] = action.run;
  setTimeout(() => { node.style.transition = "opacity .2s, transform .2s"; node.style.opacity = "0"; node.style.transform = "translateY(6px)"; setTimeout(() => node.remove(), 220); }, action ? 6000 : 2800);
}
const pendingActions = {};

/* ─────────── 骨架渲染 ─────────── */
function renderTopbar() {
  /* ★ 聚合态：顶栏是**唯一保留的公共外壳**。
     因为「聚合」的入口就在这枚作用域菜单里（D1），聚合页若没有顶栏，用户进去就出不来。 */
  if (state.agg) {
    const all = aggAll();
    const attention = all.filter((x) => aggNeedsAttention(x.a)).length;
    /* 有作用域取数失败 ⇒ 不显示「需处理」合计：拿未知冒充 0 是撒谎。 */
    const unknown = state.aggFailed.size > 0;
    $("#scope-mark").innerHTML = ICON.grid;
    $("#scope-mark").style.background = "color-mix(in oklab, var(--primary) 20%, transparent)";
    $("#scope-mark").style.color = "var(--primary)";
    $("#scope-name").textContent = "聚合 · 全部账号";
    $("#scope-sub").textContent = `${all.length} 个账号` + (!unknown && attention ? ` · ${attention} 个需处理` : "");
    /* 运行态胶囊在聚合态下**不表达任何单一客户端**（6 个作用域各有一套），
       所以只说「网关在跑」，不说「运行中」——后者会被读成「当前客户端在跑」。 */
    const pill = $("#run-pill");
    pill.className = "run-pill";
    pill.innerHTML = `<i class="dot"></i><span>${Object.keys(SCOPES).filter((id) => SCOPES[id].running).length} 个作用域运行中</span>`;
    $("#foot-dot").style.color = "var(--success)";
    return;
  }
  const s = curScope(), p = curPlatform();
  $("#scope-mark").innerHTML = p.mark;
  $("#scope-mark").style.background = `color-mix(in oklab, ${p.accent} 20%, transparent)`;
  $("#scope-mark").style.color = p.accent;
  $("#scope-name").textContent = scopeLabel(state.scope);
  const cur = currentAccount(state.scope);
  $("#scope-sub").textContent = (cur ? cur.name + (cur.email ? " · " : "") : "") + `${s.accounts.length} 个账号`;
  const pill = $("#run-pill");
  pill.className = "run-pill" + (s.running ? "" : " off");
  /* 没装客户端时不能写「未检测到」——应用本身在跑，读起来像故障。这里说的是**客户端**状态。 */
  pill.innerHTML = `<i class="dot"></i><span>${s.running ? "运行中" : s.installed ? "未运行" : "无客户端"}</span>`;
  $("#foot-dot").style.color = s.running ? "var(--success)" : "var(--muted-fg)";
}

function renderNav() {
  const s = curScope(), p = curPlatform();
  const badges = {
    accounts: { n: s.accounts.length, warn: expiredCount(s) > 0 },
    gateway: { n: s.gatewayKeys, warn: false },
    /* 待同步会话数：含「落后」与「分叉」，让用户知道有事要处理 */
    sessions: sessionPendingCount() ? { n: sessionPendingCount(), warn: true } : null,
  };
  /* 目的地按**平台能力**过滤（§2.7 的平台固有维度）：缺能力就不渲染入口。
     ⚠️ 只是「不渲染入口」—— **URL 直达仍然可用**，由页面自己给空态（§3.2 规则 2）。 */
  const dests = DESTINATIONS.filter((d) => !d.cap || p.capabilities.includes(d.cap));
  $("#nav").innerHTML = dests.map((d) => {
    const b = badges[d.id];
    /* 徽章 HTML 两种位置共用（行尾 / 图标角标）—— 同一份 data-badge 供测试按属性找，
       不靠「第几个 span」。 */
    const badge = b && b.n ? `<span class="nav-badge${b.warn ? " warn" : ""}" data-badge="${d.id}">${b.n}</span>` : "";
    /* ★ 折叠态：图标包一层 `nav-icon-wrap`（角标的定位锚）+ 右侧 tooltip；
       文字干脆不渲染（与真机一致 —— CSS `display:none` 会让 innerHTML 断言读不到）。 */
    if (state.sideCollapsed) {
      return `<button class="nav-item${state.dest === d.id ? " active" : ""}" data-act="nav|${d.id}"
        title="${d.label}" aria-label="${d.label}">
        <span class="nav-icon-wrap">${d.icon}${badge}</span>
        <span class="nav-tip" role="tooltip">${d.label}</span>
      </button>`;
    }
    return `<button class="nav-item${state.dest === d.id ? " active" : ""}" data-act="nav|${d.id}">
      ${d.icon}<span class="nav-label">${d.label}</span>
      ${badge}
    </button>`;
  }).join("");
}

/* 侧栏折叠：只切 class + 重渲染导航（徽章位置随形态变），不动内容区。 */
function renderSidebar() {
  const side = $(".sidebar");
  if (!side) return;
  side.classList.toggle("collapsed", state.sideCollapsed);
  const toggle = $("#side-toggle");
  if (toggle) {
    toggle.setAttribute("aria-expanded", String(!state.sideCollapsed));
    const label = toggle.querySelector(".nav-label");
    if (label) label.textContent = state.sideCollapsed ? "展开侧栏" : "收起侧栏";
  }
  renderNav();
}

function renderContent() {
  if (state.loading) { $("#content").innerHTML = skeleton(); return; }
  /* ★ 聚合是**独立界面**：没有左侧导航栏，顶栏下方直接就是卡片区。
     侧栏由 `body.agg-mode` 隐藏（CSS），`state.dest` 保持原值 —— 退出聚合时回到原页面。 */
  if (state.agg) {
    $("#content").innerHTML = viewAggregate();
    $("#content").scrollTop = 0;
    return;
  }
  const map = { overview: viewOverview, accounts: viewAccounts, usage: viewUsage, sessions: viewSessions, gateway: viewGateway, settings: viewSettings };
  $("#content").innerHTML = map[state.dest]();
  $("#content").scrollTop = 0;
  /* D1：账号页渲染后立刻再同步一次列表区。工具栏里的「全选」按钮与列表区
     必须出自同一个 allSel 计算——否则视图里硬编码的初始值会造成
     「首屏按钮语义错误、要点两次才生效」。以后改列表逻辑不会再漏同步按钮。 */
  if (state.dest === "accounts") renderAccountList();
}

function skeleton() {
  return `<div class="page">

    <div class="sk" style="height:14px;width:340px;margin-bottom:24px"></div>
    <div class="grid g4" style="margin-bottom:20px">
      ${Array.from({ length: 4 }, () => `<div class="card stat"><div class="sk" style="height:12px;width:60%"></div><div class="sk" style="height:24px;width:40%;margin-top:10px"></div></div>`).join("")}
    </div>
    <div class="grid g3">
      ${Array.from({ length: 6 }, () => `<div class="card card-pad"><div class="sk" style="height:34px;width:34px;border-radius:10px"></div><div class="sk" style="height:14px;width:70%;margin-top:12px"></div><div class="sk" style="height:12px;width:50%;margin-top:8px"></div><div class="sk" style="height:28px;width:100%;margin-top:14px"></div></div>`).join("")}
    </div>
  </div>`;
}

function renderAll() {
  /* 聚合态没有侧栏：整块 `<aside>` 用 class 隐藏（而不是 `innerHTML = ""`）——
     侧栏 DOM 保持存在，退出聚合时不必重建，`#foot-ver` 等一次性回填也不会丢。 */
  document.body.classList.toggle("agg-mode", state.agg);
  renderTopbar(); renderNav(); renderContent(); renderCompanion();
}

/* ══════════════════════ 桌面悬浮窗（§3.16 / D21 已拍板） ══════════════════════
   独立浮层，**只读** —— 不承载任何写操作（§3.16 明确「不做的」）。
   ⚠️ 它是**独立窗口** ⇒ 键盘可达性必须**单独验证**，不能假定主窗口的焦点管理适用。 */
const COMPANION_STATE = {
  running: { label: "运行中", cls: "run" },
  waiting: { label: "待确认", cls: "wait" },
  done: { label: "已完成", cls: "done" },
  failed: { label: "失败", cls: "fail" },
};

function renderCompanion() {
  const slot = $("#companion-slot");
  if (!slot) return;
  /* 聚合视图下不显示会话悬浮窗：它列的是**当前作用域**的会话（单作用域概念），
     摆在聚合页上既不对应任何作用域，又会盖住右下角的卡片。 */
  if (state.agg || !state.companionOpen) { slot.innerHTML = ""; return; }
  const rows = COMPANION_SOURCES.map((c) => {
    const m = COMPANION_STATE[c.state] || COMPANION_STATE.done;
    /* 标题默认模糊（防截图 / 投屏泄露），悬停才看清 —— 与 §3.3 的邮箱脱敏同一原则。 */
    return `<button class="cp-row" data-act="cp-jump|${c.id}" title="${esc(c.title)}">
      <i class="cp-dot ${m.cls}"></i>
      <span class="cp-text"><b>${esc(c.source)}</b><span class="cp-title">${esc(c.title)}</span></span>
      <span class="cp-hint">${esc(c.hint)}</span>
    </button>`;
  }).join("");
  const waiting = COMPANION_SOURCES.filter((c) => c.state === "waiting").length;
  slot.innerHTML = `<aside class="companion" role="complementary" aria-label="会话状态悬浮窗（只读）">
    <header class="cp-head">
      <i class="cp-live"></i><b>会话状态</b>
      ${waiting ? `<span class="badge warn">${waiting} 待确认</span>` : ""}
      <span class="grow"></span>
      <button class="cp-x" data-act="cp-close" title="隐藏悬浮窗" aria-label="隐藏悬浮窗">×</button>
    </header>
    <div class="cp-body">${rows}</div>
    <footer class="cp-foot">只读 · 点击回到原会话 · 标题悬停显示</footer>
  </aside>`;
}

/* ══════════════════════ 概览 ══════════════════════ */
function viewOverview() {
  const s = curScope(), p = curPlatform();
  const cur = currentAccount(state.scope);
  /* 概览永远看「当前作用域」，不受用量页的合并开关影响。 */
  const u = USAGE[state.scope];
  const today = u.days[u.days.length - 1];
  const prev = u.days[u.days.length - 2] || today;
  /* 「对比昨日」用 days 的最后两天真实计算，不再硬编码 +12%。 */
  const delta = prev.value ? Math.round(((today.value - prev.value) / prev.value) * 100) : 0;
  const deltaTone = delta >= 0 ? "up" : "down";
  const deltaText = `对比昨日 ${delta >= 0 ? "+" : ""}${delta}%`;

  /* 待处理项：这才是「概览」存在的意义——回答「有什么要我处理」 */
  const todos = [];
  const expired = s.accounts.filter((a) => a.expired);
  const relogin = s.accounts.filter((a) => a.needsRelogin);
  const notChecked = s.accounts.filter((a) => !a.checkedIn && !a.expired);
  const expiring = s.accounts.filter((a) => a.expiring > 0 && a.expireInDays <= 5);
  if (relogin.length) todos.push({ tone: "bad", title: `${relogin.length} 个账号需要重新登录`, desc: relogin.map((a) => a.name).join("、"), act: "去处理", dest: "accounts" });
  if (expired.length) todos.push({ tone: "bad", title: `${expired.length} 个账号凭据已过期`, desc: expired.map((a) => a.name).join("、"), act: "去处理", dest: "accounts" });
  if (notChecked.length) todos.push({ tone: "warn", title: `${notChecked.length} 个账号今日未签到`, desc: notChecked.map((a) => a.name).join("、"), act: "一键签到", run: "batch-checkin" });
  if (expiring.length) todos.push({ tone: "warn", title: `${expiring.length} 个账号的积分将在 5 天内过期`, desc: `共 ${fmt(expiring.reduce((x, a) => x + a.expiring, 0))} 积分`, act: "查看", dest: "accounts" });
  if (!s.running) todos.push({ tone: "info", title: "客户端当前未运行", desc: "账号切换需要客户端在运行状态", act: "去设置", dest: "settings" });
  if (!s.accounts.length) todos.push({ tone: "info", title: "这个作用域还没有账号", desc: "先添加一个账号才能使用", act: "添加账号", run: "add-account" });

  const otherScopes = Object.keys(SCOPES).filter((id) => id !== state.scope);

  return `<div class="page">
    <div class="page-head">
      <div>
        <h1>概览</h1>
        <p>${scopeLabel(state.scope)} · 客户端版本 ${s.version} · ${cur ? `当前登录 <b>${esc(cur.name)}</b>` : "<b>未登录</b>"}</p>
      </div>
      <div class="grow"></div>
      <button class="btn" data-act="refresh">${ICON.refresh}刷新</button>
    </div>

    ${checkinResultHtml()}

    <!-- 待处理优先：概览先回答「有什么要我处理」，统计块退到其后 -->
    <section class="card" style="margin-bottom:20px">
      <div class="card-head">
        <h3>待处理</h3>
        <div class="grow"></div>
        <span class="sub">${todos.length} 项</span>
      </div>
      ${todos.length ? todos.map((t) => `
        <div class="srow">
